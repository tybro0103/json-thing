<!DOCTYPE html>
<html>
  <head>
    <title>JSON Thing</title>
    <link rel="stylesheet" href="menu.css">
  </head>
  <body>
    <h1>JSON Thing Settings</h1>

    <label>
      <span>Show array indices</span>
      <input type="checkbox" class="array-indices-cb">
    </label>

    <label>
      <span>Indentation spaces</span>
      <input type="number" min="0" max="16" class="space-count-input">
    </label>

    <div class="save-btn-con">
      <button class="save-btn">Save</button>
    </div>

    <script src="menu.js"></script>
  </body>
</html>
